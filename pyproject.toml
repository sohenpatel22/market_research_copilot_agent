[project]
name = "market-copilot"
version = "0.1.0"
description = "Agentic RAG assistant over SEC filings and stock price data with forecasting model integration"
readme = "README.md"
requires-python = "==3.11.*"
license = { text = "MIT" }
dependencies = [
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "ruff==0.7.4",
    "pytest==8.3.3",
    "pytest-cov==6.0.0",
]

[build-system]
requires = ["hatchling==1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_copilot"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
